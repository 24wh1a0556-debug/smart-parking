services:

  postgres:
    image: postgres:16-alpine
    container_name: smart_parking_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_parking"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    networks:
      - smart_parking_net


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: smart_parking_backend
    restart: unless-stopped

    environment:
      NODE_ENV: production
      PORT: 5000

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_parking
      DB_USER: postgres
      DB_PASSWORD: postgres

      JWT_SECRET: smartparking_jwt_secret_key_change_in_production_2026
      JWT_EXPIRES_IN: 7d

      CORS_ORIGIN: http://localhost:3000

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - smart_parking_net


  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}

    container_name: smart_parking_frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    networks:
      - smart_parking_net


volumes:
  postgres_data:
    driver: local


networks:
  smart_parking_net:
    driver: bridge