# ============================================================
# Smart Parking – nginx configuration
#
# Responsibilities:
#   • Serve the compiled React/Vite SPA on port 80
#   • Support client-side routing (try_files fallback to index.html)
#   • Reverse-proxy /api/ requests to the backend container
# ============================================================

server {
    listen 80;
    server_name _;

    # ---- Static assets (SPA) --------------------------------
    root /usr/share/nginx/html;
    index index.html;

    # Serve pre-compressed assets when available
    gzip_static on;

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # ---- API reverse proxy ----------------------------------
    # All /api/* requests are forwarded to the backend service.
    # "backend" resolves via Docker Compose internal DNS — never localhost.
    location /api/ {
        proxy_pass         http://backend:5000;

        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Keep-alive support
        proxy_set_header   Connection        "";

        # Timeouts — generous enough for DB-backed endpoints
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Don't buffer large responses (SSE / streaming)
        proxy_buffering    off;
    }

    # ---- SPA fallback ---------------------------------------
    # Any path that is not a real file falls back to index.html
    # so the React Router can handle it client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static asset caching -------------------------------
    # Vite fingerprints assets (assets/main-abc123.js), so they
    # can be cached aggressively.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Health-check endpoint for Docker / load-balancers
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
